name: Keep Supabase Alive

on:
  schedule:
    # GitHub cron uses UTC. Runs at 00:23, 06:23, 12:23 and 18:23 in Brasília (UTC-3).
    # Avoid minute 00 because scheduled Actions can be delayed or dropped during peak load.
    - cron: "23 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PING_PATH: ${{ secrets.SUPABASE_PING_PATH }}
      SUPABASE_PING_TABLE: ${{ vars.SUPABASE_PING_TABLE }}
      SUPABASE_PING_SELECT: ${{ vars.SUPABASE_PING_SELECT }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail

          test -n "${SUPABASE_URL:-}" || {
            echo "::error::SUPABASE_URL is not configured."
            exit 1
          }

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Configure SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Query Supabase database
        run: |
          set -euo pipefail

          base_url="${SUPABASE_URL%/}"
          table="${SUPABASE_PING_TABLE:-profiles}"
          select_cols="${SUPABASE_PING_SELECT:-id}"
          default_path="rest/v1/${table}?select=${select_cols}&limit=1"
          ping_path="${SUPABASE_PING_PATH:-${default_path}}"
          ping_path="${ping_path#/}"
          endpoint="${base_url}/${ping_path}"

          # Prefer the service role when it is already configured so RLS cannot turn
          # this maintenance query into a false negative. Otherwise use the anon key.
          key="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY}}"
          response_file="$(mktemp)"

          cleanup() {
            rm -f "${response_file}"
          }
          trap cleanup EXIT

          set +e
          http_status=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 45 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            -H "apikey: ${key}" \
            -H "Authorization: Bearer ${key}" \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            -H 'User-Agent: instaanalytics-supabase-keep-alive' \
            "${endpoint}")
          curl_exit=$?
          set -e

          if [ "${curl_exit}" -ne 0 ]; then
            echo "::error::Supabase query failed (curl exit ${curl_exit}, HTTP ${http_status:-000})."
            if [ -s "${response_file}" ]; then
              echo 'Supabase response:'
              cat "${response_file}"
            fi
            exit 1
          fi

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Supabase returned HTTP ${http_status}."
            if [ -s "${response_file}" ]; then
              echo 'Supabase response:'
              cat "${response_file}"
            fi
            exit 1
          fi

          echo "Real database query completed successfully (HTTP ${http_status})."

      - name: Failure diagnostics
        if: failure()
        run: |
          set -u
          host=$(echo "${SUPABASE_URL}" | cut -d/ -f3)
          echo "Host: ${host}"
          nslookup "${host}" || true
